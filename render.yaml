services:
  # Frontend Service (React Client)
  - type: web
    name: contract-obligation-frontend
    env: static
    buildCommand: cd client && npm install && npm run build
    staticPublishPath: ./client/dist
    envVars:
      - key: VITE_API_URL
        value: https://contractiq-server.onrender.com
      - key: VITE_API_BASE_URL
        value: https://contractiq-server.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # Backend Service (FastAPI Server)
  - type: web
    name: contractiq-server
    env: python
    buildCommand: cd server && pip install -r requirements.txt
    startCommand: cd server && python -m uvicorn src.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: DATABASE_URL
        sync: false # Set this in Render dashboard - PostgreSQL connection string
      - key: TOKEN_SECRET
        generateValue: true # Auto-generate secure secret
      - key: TOKEN_TTL_SECONDS
        value: 28800
      - key: SECRET_KEY
        sync: false # Set this in Render dashboard - compatibility
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 480