databases:
  - name: contractiq-db-komma-anushka
    plan: free
    databaseName: contractiq
    user: contractiq

services:
  - type: web
    name: contractiq-api-komma-anushka
    runtime: python
    plan: free
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: contractiq-db-komma-anushka
          property: connectionString
      - key: ALLOWED_ORIGINS
        sync: false

  - type: web
    name: contractiq-web-komma-anushka
    runtime: static
    rootDir: Client
    buildCommand: npm ci && npm run build
    staticPublishPath: build
    envVars:
      - key: REACT_APP_API_URL
        sync: false
